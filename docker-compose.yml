services:
  mongo:
    image: mongo:9
    environment:
      - MONGO_INITDB_DATABASE=telegram-youtube-bot
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s

volumes:
  mongo_data:
    name: telegram_youtube_bot_mongo_data
