name: CI

env:
  APP_NAME: ${{ github.event.repository.name }}

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - parallel:
          - run: bun dedupe --check
          - run: bunx eslint
          - run: bun run test
          - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            cli
            ${{ env.APP_NAME }}.service

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifacts
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "cli,${{ env.APP_NAME }}.service"
          target: /tmp
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p ${{ secrets.APP_DIR }}
            mv /tmp/{cli,${{ env.APP_NAME }}.service} "${{ secrets.APP_DIR }}/"
            cd ${{ secrets.APP_DIR }}
            echo '${{ secrets.ENV_FILE }}' > .env
            . .env
            cat > /tmp/Caddyfile <<EOF
            ${DOMAIN} {
              reverse_proxy localhost:${PORT}
            }
            EOF
            caddy validate --config /tmp/Caddyfile
            cp /tmp/Caddyfile /etc/caddy/Caddyfile
            systemctl reload caddy
            chmod +x cli
            cp ${{ env.APP_NAME }}.service /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable ${{ env.APP_NAME }}
            systemctl restart ${{ env.APP_NAME }}
